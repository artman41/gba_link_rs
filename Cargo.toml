[package]
name = "gba_link_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
critical-section = "1.1"
panic-halt = "0.2.0"
embassy-embedded-hal = { version = "0.5.0" }
embassy-executor = { version = "0.9.0", features = ["arch-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-rp = {version = "0.8.0", features = ["rp2040", "time-driver"]}
embassy-sync = {version = "0.7.2"}
embassy-time = {version = "0.5.0"}
embassy-usb = {version = "0.5.1"}

usbd-hid = "0.8.1"
serde = { version = "1.0", default-features = false, features = ["derive"] }
log = "0.4"
static_cell = "2.1"
portable-atomic = { version = "1.5", features = ["critical-section"] }

# I2C LCD dependencies
hd44780-driver = "0.4"
embedded-hal = "1.0"

cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
embassy-futures = "0.1.2"
heapless = {version = "0.9.1", features = ["portable-atomic"]}

[profile.release]
# Enable generation of debug symbols even on release builds
debug = true

[package.metadata.embassy]
build = [
  { target = "thumbv6m-none-eabi", artifact-dir = "artifacts" }
]
